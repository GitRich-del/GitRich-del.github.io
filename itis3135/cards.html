<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richard Siebenlist Jr. | ITIS3135 | Resilient Shark Cards</title>
    <link rel="stylesheet" href="styles/default.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>

<body class="home-page">
    <div id="page-wrapper">
        <div data-include="components/header.html"></div>

        <main>
            <h2 class="page-title">Cards</h2>
            <div class="card-container">
                <!-- Card 1: The Resilient Beanie -->
                <div class="card card-1">
                    <div class="card-inner">
                        <div class="card-rank">A</div>
                        <div class="card-img-wrapper">
                            <img src="images/cards/card_beanie.png" alt="Resilient Beanie Card">
                        </div>
                        <h3>Beanie</h3>
                        <p>A resilient gray knitted beanie. Worn by sharks who never give up.</p>
                        <div class="card-rank-bottom">A</div>
                    </div>
                </div>
                
                <!-- Card 2: The Silver Chain -->
                <div class="card card-2">
                    <div class="card-inner">
                        <div class="card-rank">K</div>
                        <div class="card-img-wrapper">
                            <img src="images/card_chain_dir/card_chain.png" alt="Silver Shark Chain Card">
                        </div>
                        <h3>Chain</h3>
                        <p>Strength in every link. Resilient to its core.</p>
                        <div class="card-rank-bottom">K</div>
                    </div>
                </div>
                
                <!-- Card 3: The RS Pendant -->
                <div class="card card-3">
                    <div class="card-inner">
                        <div class="card-rank">J</div>
                        <div class="card-img-wrapper">
                            <img src="images/card_pendant_dir/card_pendant.png" alt="RS Pendant Card">
                        </div>
                        <h3>Pendant</h3>
                        <p>The symbol of the true resilient squad.</p>
                        <div class="card-rank-bottom">J</div>
                    </div>
                </div>
            </div>
        </main>

        <div data-include="components/footer.html"></div>
    </div>
    <script src="scripts/include.min.js"></script>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</body>

</html>
