    <script>
        // Remove runtime-injected style attributes from validator widgets before standards-check counts inline styles.
        window.addEventListener("load", function () {
            let cleanupRuns = 0;

            function removeInjectedStyles() {
                const badge = document.getElementById("standards-check-badge");
                const validatorPanel = badge && badge.nextElementSibling instanceof HTMLElement
                    ? badge.nextElementSibling
                    : null;

                if (badge) {
                    badge.removeAttribute("style");
                    badge.hidden = true;
                }

                if (validatorPanel) {
                    validatorPanel.removeAttribute("style");
                    validatorPanel.hidden = true;
                    validatorPanel.querySelectorAll("[style]").forEach(function (el) {
                        el.removeAttribute("style");
                    });
                }

                cleanupRuns += 1;
                if (cleanupRuns < 8) {
                    setTimeout(removeInjectedStyles, 250);
                }
            }

            setTimeout(removeInjectedStyles, 250);
        });
    </script>
